server {
    listen 80;
    server_name localhost;

    # 1. Servir los archivos estáticos de React (Vite)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Esto es vital para React Router (SPA)
        try_files $uri $uri/ /index.html;
    }

    # 2. Redirigir las peticiones de la API al backend
    location /api/ {
        # 'backend' es el nombre del servicio en tu docker-compose.yml
        # Sin slash final en proxy_pass para preservar el prefijo /api/
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 3. (Opcional) Servir las imágenes subidas desde el backend
    location /uploads/ {
        proxy_pass http://backend:3000;
    }
}